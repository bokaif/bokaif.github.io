<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bokaif</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v6.0.0-beta3/css/all.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js" defer></script>
    <!-- Iconify Icons -->
    <script src="https://code.iconify.design/2/2.2.1/iconify.min.js" defer></script>
</head>

<body>
    <div id="background"></div>
    <div id="main">
        <div id="m_group">
            <img id="bokaif_img" src="bokaif.svg" alt="Bokaif Logo" draggable="false">
            <p class="info">infp &mdash; <span id="age"></span>y/o &mdash; dumbest being</p>
            <p class="info cycle"></p>
        </div>
    </div>

    <div id="random-photos"></div>

    <footer id="footer">
        <div class="social-container">

            <div class="social-item sp">
                <a href="#" onclick="copyEmail(event)">
                    <span class="iconify email-icon" data-icon="mdi:email" data-inline="false"></span>
                    <span class="iconify check-icon" data-icon="lucide:clipboard-copy" data-inline="false" style="display: none;"></span>
                </a>
            </div>

            <div class="social-item sp2">
                <a href="https://github.com/bokaif" target="_blank" rel="noopener noreferrer">
                    <span class="iconify" data-icon="mdi:github"></span>
                </a>
            </div>

            <div class="social-item sp2">
                <a href="https://linkedin.com/in/bokaif" target="_blank" rel="noopener noreferrer">
                    <span class="iconify" data-icon="mdi:linkedin"></span>
                </a>
            </div>

            <div class="social-item sp2">
                <a href="https://behance.net/bokaif" target="_blank" rel="noopener noreferrer">
                    <span class="iconify" data-icon="mdi:behance"></span>
                </a>
            </div>
            
            <div class="separator">|</div>
            
            <div class="social-item sp">
                <button id="mystery-button">
                    <span class="iconify" data-icon="mdi:space-invaders"></span>
                    Feeling Lucky?
                </button>
            </div>
        </div>
    </footer>
</body>

<script src="grained.js" defer></script>
<script src="script.js" defer></script>

</html>
